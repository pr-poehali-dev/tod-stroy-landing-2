<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark background -->
  <rect width="64" height="64" fill="#0d0d0d"/>

  <!-- Corner architectural marks — top-left -->
  <line x1="4" y1="4" x2="18" y2="4" stroke="#b8a06a" stroke-width="1.2"/>
  <line x1="4" y1="4" x2="4" y2="18" stroke="#b8a06a" stroke-width="1.2"/>

  <!-- Corner architectural marks — top-right -->
  <line x1="60" y1="4" x2="46" y2="4" stroke="#b8a06a" stroke-width="1.2"/>
  <line x1="60" y1="4" x2="60" y2="18" stroke="#b8a06a" stroke-width="1.2"/>

  <!-- Corner architectural marks — bottom-left -->
  <line x1="4" y1="60" x2="18" y2="60" stroke="#b8a06a" stroke-width="1.2"/>
  <line x1="4" y1="60" x2="4" y2="46" stroke="#b8a06a" stroke-width="1.2"/>

  <!-- Corner architectural marks — bottom-right -->
  <line x1="60" y1="60" x2="46" y2="60" stroke="#b8a06a" stroke-width="1.2"/>
  <line x1="60" y1="60" x2="60" y2="46" stroke="#b8a06a" stroke-width="1.2"/>

  <!-- Subtle mid-axis ticks -->
  <line x1="32" y1="4" x2="32" y2="9" stroke="#b8a06a" stroke-width="0.6" opacity="0.35"/>
  <line x1="32" y1="55" x2="32" y2="60" stroke="#b8a06a" stroke-width="0.6" opacity="0.35"/>
  <line x1="4" y1="32" x2="9" y2="32" stroke="#b8a06a" stroke-width="0.6" opacity="0.35"/>
  <line x1="55" y1="32" x2="60" y2="32" stroke="#b8a06a" stroke-width="0.6" opacity="0.35"/>

  <!-- Letter T — geometric architectural form -->
  <!-- Top horizontal bar -->
  <rect x="11" y="13" width="42" height="5.5" fill="#b8a06a"/>
  <!-- Vertical bar centered -->
  <rect x="29.25" y="13" width="5.5" height="38" fill="#b8a06a"/>

  <!-- Accent dots — architectural details -->
  <rect x="11" y="49" width="2.5" height="2.5" fill="#b8a06a" opacity="0.4"/>
  <rect x="50.5" y="49" width="2.5" height="2.5" fill="#b8a06a" opacity="0.4"/>
</svg>